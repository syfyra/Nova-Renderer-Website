# Builds the site and publishes it to GitHub Pages.
#
# One-time setup in the repository: Settings > Pages > Build and deployment >
# Source: "GitHub Actions". After that, every push to main deploys, and the
# workflow can also be started by hand from the Actions tab.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a running deployment is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Tells the build where the site will live: the origin and, for a
      # project site, the /<repository> sub-path. A custom domain set in the
      # Pages settings is picked up here without changing this file.
      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - run: npm run check

      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Only used to read the public Nova-Renderer repository (stars and
          # the latest release) without hitting the anonymous rate limit.
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
